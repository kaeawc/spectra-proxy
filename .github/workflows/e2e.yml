name: E2E

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: kaeawc/spectra ref to build Spectra from
        required: false
        default: main
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaeawc/spectra
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: SPECTRA_CORE_DIR="$PWD/core" make e2e
